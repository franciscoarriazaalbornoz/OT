<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Consulta el estado de tu vehículo</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body{background:var(--bg-page);}
  .wrap{max-width:460px;margin:0 auto;padding:24px 16px 60px;}
  .head{text-align:center;margin-bottom:20px;}
  .head h1{font-size:19px;margin:0 0 4px;}
  .head p{font-size:13px;color:var(--text-2);margin:0;}
  .search-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;}
  .search-box label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:600;}
  .search-row{display:flex;gap:8px;}
  .search-row input{flex:1;height:46px;font-size:16px;text-transform:uppercase;font-family:var(--mono);}
  .search-row button{height:46px;padding:0 18px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer;}
  .msg{text-align:center;font-size:13px;margin-top:10px;}
  .msg.error{color:var(--accent);}

  .result{display:none;}
  .result .info{background:var(--bg-header);color:#fff;padding:16px;border-radius:12px;margin-bottom:16px;}
  .result .info .ot{font-family:var(--mono);font-size:17px;font-weight:700;}
  .result .info .modelo{font-size:13.5px;color:#cfcdc7;margin-top:2px;}
  .result .info .suc{font-size:12px;color:#9c9a94;margin-top:2px;}

  .stepper{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .step{display:flex;align-items:flex-start;gap:10px;padding:8px 0;}
  .step .bullet{width:22px;height:22px;border-radius:50%;background:#E4E2DA;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-2);}
  .step.done .bullet{background:#1E8A5F;color:#fff;}
  .step.current .bullet{background:var(--accent);color:#fff;}
  .step .label{font-size:13.5px;padding-top:2px;color:var(--text-2);}
  .step.done .label{color:var(--text);}
  .step.current .label{color:var(--text);font-weight:700;}

  .entrega-box{margin-top:14px;background:#EDEBE4;border-radius:10px;padding:12px;text-align:center;font-size:13px;}
  .entrega-box .label{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.4px;}
  .entrega-box .value{font-size:15px;font-weight:700;margin-top:2px;}
  .cliente-fotos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .cliente-fotos-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>¿Cómo va tu vehículo?</h1>
    <p>Ingresa tu patente para ver el estado de tu orden de trabajo</p>
  </div>

  <div class="search-box">
    <label>Patente</label>
    <div class="search-row">
      <input id="patenteInput" placeholder="AB1234" maxlength="8">
      <button id="buscarBtn">Buscar</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="result" id="result">
    <div class="info">
      <div class="ot" id="v_modelo"></div>
      <div class="modelo" id="v_patente"></div>
      <div class="suc" id="v_sucursal"></div>
    </div>
    <div class="stepper" id="stepper"></div>
    <div class="entrega-box" id="entregaBox" style="display:none;">
      <div class="label">Entrega estimada</div>
      <div class="value" id="v_entrega"></div>
    </div>
    <div id="fotosBox" style="display:none;margin-top:14px;">
      <div class="entrega-box" style="text-align:left;">
        <div class="label" style="margin-bottom:8px;">Fotos del vehículo</div>
        <div class="cliente-fotos-grid" id="fotosGrid"></div>
      </div>
    </div>
  </div>
</div>
<script src="/consulta.js"></script>
</body>
</html>
